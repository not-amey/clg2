<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Shriman G. R. Warange Junior College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: #1E293B;
            background-color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            width: 100%;
        }

        /* Split Layout */
        .split-layout {
            display: flex;
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
        }

        /* Left Panel - Deep Navy */
        .left-panel {
            width: 45%;
            background-color: #1F3A5F;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 3rem;
        }

        .left-content {
            max-width: 400px;
            margin: 0 auto;
        }

        .college-logo-left {
            width: 52px;
            height: 52px;
            background-color: #FFFFFF;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            color: #1F3A5F;
            font-weight: 700;
            font-size: 20px;
        }

        .college-title-left {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            color: #FFFFFF;
        }

        .college-sub-left {
            font-size: 14px;
            color: #94A3B8;
            font-weight: 400;
        }

        /* Right Panel - Form Container */
        .right-panel {
            flex: 1;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 2rem 2rem;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
            margin: auto;
        }

        /* Mobile Header Logo */
        .mobile-header {
            display: none;
            margin-bottom: 2rem;
            text-align: left;
        }

        .mobile-logo {
            width: 44px;
            height: 44px;
            background-color: #1F3A5F;
            color: #FFFFFF;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 0.75rem;
        }

        .mobile-title {
            font-size: 18px;
            font-weight: 700;
            color: #1F3A5F;
        }

        /* Form Styling */
        .form-header {
            margin-bottom: 2rem;
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            color: #0F172A;
            margin-bottom: 0.5rem;
        }

        .form-subtitle {
            font-size: 14px;
            color: #64748B;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.5rem;
        }

        .input-container {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 42px;
            padding: 0 0.85rem;
            font-family: inherit;
            font-size: 14px;
            color: #0F172A;
            background-color: #FFFFFF;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-input:focus {
            border-color: #1F3A5F;
            box-shadow: 0 0 0 2px #1F3A5F;
        }

        /* Password toggle button */
        .password-toggle {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 500;
            color: #64748B;
            cursor: pointer;
            padding: 8px;
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #1F3A5F;
        }

        /* Row: Remember Me & Forgot Password */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            min-height: 44px;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1F3A5F;
            border-radius: 4px;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 14px;
            font-weight: 500;
            color: #1F3A5F;
            text-decoration: none;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Button */
        .btn-submit {
            width: 100%;
            height: 44px;
            background-color: #1F3A5F;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-submit:hover {
            background-color: #162A45;
        }

        /* Inline Error */
        .error-message {
            display: none;
            margin-top: 1rem;
            font-size: 14px;
            color: #DC2626;
            line-height: 1.4;
        }

        /* Footer */
        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #94A3B8;
            margin-top: 2rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .left-panel {
                display: none;
            }

            .right-panel {
                padding: 2.5rem 1.5rem 1.5rem;
            }

            .mobile-header {
                display: block;
            }
        }

        @media (max-width: 480px) {
            .right-panel {
                padding: 1.5rem 1rem 1rem;
            }

            .form-title {
                font-size: 20px;
            }

            .mobile-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="left-content">
                <div class="college-logo-left">SG</div>
                <h1 class="college-title-left">Shriman G. R. Warange Junior College</h1>
                <p class="college-sub-left">Administrative Portal</p>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="form-wrapper">
                <!-- Mobile Branding -->
                <div class="mobile-header">
                    <div class="mobile-logo">SG</div>
                    <div class="mobile-title">Shriman G. R. Warange Junior College</div>
                </div>

                <div class="form-header">
                    <h2 class="form-title">Sign in</h2>
                    <p class="form-subtitle">Enter administrator password to continue</p>
                </div>

                <form id="login-form" autocomplete="off">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-container">
                            <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="Enter password">
                            <button type="button" class="password-toggle" id="toggle-password-btn" onclick="togglePasswordVisibility()">Show</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Sign in</button>

                    <div id="error-message" class="error-message"></div>
                </form>
            </div>

            <div class="footer-text">
                &copy; 2026 Shriman G. R. Warange Junior College. All rights reserved.
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggle-password-btn');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('error-message');
            errDiv.style.display = 'none';
            errDiv.textContent = '';

            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.status === 200) {
                    window.location.href = '/admin';
                } else if (res.status === 401) {
                    errDiv.style.display = 'block';
                    errDiv.textContent = 'Wrong password.';
                } else {
                    errDiv.style.display = 'block';
                    errDiv.textContent = 'Login failed. Please try again.';
                }
            } catch (err) {
                errDiv.style.display = 'block';
                errDiv.textContent = 'Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
